<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publishing Studio Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
/* Layout: fixed app shell — header 54 / navy sidebar 223 / work grid 268 · fluid · 392 over a 236px card row. Matches mockup at 1536×1024. Light-only by design. */
:root{
  color-scheme: light;
  --app:#F5F7FB; --surface:#FFFFFF; --subtle:#F5F7FB;
  --line:#E6E9F0; --line-input:#DFE3EB; --divider:#EEF0F5;
  --ink:#0F172A; --body:#2B3446; --ink-2:#1E2638; --muted:#6B7488; --muted-2:#737C8F;
  --side:#14213A; --side-active:#2B3D63; --side-line:#2B3954; --side-ink:#E4E9F3; --side-muted:#A3AEC4;
  --blue:#1F56E0; --blue-hover:#1642B4; --blue-soft:#E5EDFC; --blue-border:#93B1F2; --blue-bright:#2563EB;
  --violet-a:#6A46EC; --violet-b:#8A68F4; --violet:#6B48ED;
  --red:#E5484D; --red-bg:#FDF1F2; --red-tile:#FDE9EA; --red-disc:#FBDFE2; --pdf:#EA4B4F;
  --amber:#F0A10B; --amber-badge:#F5A524; --amber-bg:#FFF6E6; --amber-tile:#FFF3DD; --amber-disc:#FDE8C4;
  --green:#1F9D5C; --green-check:#3FB07A; --green-bg:#EDF8F1; --green-tile:#E4F5EB; --green-disc:#D3EFDF; --epub:#2FB36B;
  --info-bg:#EEF3FD; --info-disc:#D9E5FC;
  --draft-bg:#1D4A43; --draft-ink:#8EE3C0;
  --mark:#D6E6FD; --mark-line:#6D9CF0; --applied:#DCF3E5;
  --callout:#F3F7FF; --callout-line:#B9CDF3;
  --row-active:#E7EEFD; --row-active-ink:#1D3FA8; --plus:#8A91A1;
  --scrim:rgba(15,23,42,.38); --toast:#0F172A; --toast-ink:#FFFFFF;
  --ui:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --serif:'Source Serif 4', Georgia, 'Times New Roman', serif;
  --shadow-pop:0 6px 20px rgba(17,26,46,.12);
  --shadow-menu:0 10px 30px rgba(17,26,46,.16);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--app);color:var(--ink);font:13px/1.4 var(--ui);letter-spacing:-.1px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--blue);text-decoration:none}a:hover{color:var(--blue-hover)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
svg{flex:0 0 auto}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{height:100%;min-height:720px;display:grid;grid-template-rows:54px minmax(0,1fr)}

/* Header */
.hdr{position:relative;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;z-index:30}
.brand{width:285px;display:flex;align-items:center;gap:15px;padding-left:25px;flex:0 0 auto}
.brand b{font-size:20px;font-weight:700;letter-spacing:-.4px;color:var(--ink);white-space:nowrap}
.topnav{display:flex;gap:34px;height:54px;flex:1 1 auto;min-width:0}
.topnav button{display:flex;align-items:center;font-size:14.5px;color:var(--body-2);white-space:nowrap;border-bottom:3px solid transparent;padding-top:3px}
.topnav button[aria-current="page"]{color:var(--blue);font-weight:600;border-bottom-color:var(--blue);padding:3px 5px 0;margin:0 -5px}
.hdr-right{display:flex;align-items:center;gap:19px;padding-right:20px;flex:0 0 auto}
.search{width:206px;height:33px;border:1px solid var(--line-input);border-radius:7px;display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--muted)}
.search span{flex:1;text-align:left;font-size:13px}
.search kbd{font:11px var(--ui);letter-spacing:3px;color:var(--muted)}
.icon-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--ink-2);position:relative}
.icon-btn:hover{background:var(--subtle)}
.dot-badge{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--surface)}
.avatar{width:37px;height:37px;border-radius:50%;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.only-narrow{display:none!important}

/* Shell */
.shell{display:grid;grid-template-columns:223px minmax(0,1fr);min-height:0}
.side{background:var(--side);color:var(--side-ink);border-radius:0 10px 0 0;padding:21px 10px 20px;overflow-y:auto;margin-top:1px;scrollbar-width:none}
.book{display:flex;gap:10px;padding:0 9px 12px;min-height:98px}
.book img{width:46px;height:73px;border-radius:2px;object-fit:cover}
.book-t{color:#fff;font-weight:600;font-size:13.5px;line-height:19px}
.book-m{font-size:11.5px;color:var(--side-muted);margin-top:2px;font-variant-numeric:tabular-nums}
.chip-draft{display:inline-block;background:var(--draft-bg);color:var(--draft-ink);font-size:11.5px;font-weight:500;padding:2px 6px;border-radius:4px;margin-top:5px}
.snav{display:flex;flex-direction:column}
.snav button{display:flex;align-items:center;gap:15px;height:34px;padding:0 14px;border-radius:6px;font-size:13px;color:var(--side-ink);text-align:left;width:100%}
.snav button:hover{background:rgba(255,255,255,.05)}
.snav button[aria-current="page"]{background:var(--side-active);color:#fff;font-weight:600;height:36px;margin:4px 0}
.snav .lbl{flex:1}
.snav .badge{background:var(--red);color:#fff;font-size:11px;font-weight:600;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.sdiv{height:1px;background:var(--side-line);margin:17px 8px 16px}
.shead{font-size:11px;letter-spacing:1.6px;color:var(--side-muted);padding:0 10px 7px;font-weight:500}

/* Work grid */
.work{display:grid;grid-template-columns:268px minmax(0,1fr) 392px;grid-template-rows:minmax(0,1fr) 236px;gap:11px 10px;padding:9px 10px 12px 9px;min-height:0;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0;min-height:0}
.outline{grid-row:1/3;grid-column:1;display:flex;flex-direction:column;padding-top:6px}
.editor{grid-column:2;grid-row:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
#tbPop{position:absolute;left:0;right:0;top:0;height:0;z-index:25}
.ai{grid-column:3;grid-row:1;padding:6px 13px 0;display:flex;flex-direction:column;overflow:hidden}
.bottom{grid-column:2/4;grid-row:2;display:grid;grid-template-columns:217fr 371fr 188fr 210fr;gap:10px;min-width:0}
.work.is-placeholder>:not(.page){display:none}
.placeholder{grid-column:1/-1;grid-row:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:40px 20px}
.placeholder h2{margin:0;font-size:22px;font-weight:600;text-wrap:balance}
.placeholder p{margin:0;color:var(--muted);max-width:46ch}
.flash{animation:flash 1.1s ease}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(31,86,224,0)}30%{box-shadow:0 0 0 3px rgba(31,86,224,.45)}}

/* Tabs */
.tabs{display:flex;height:40px;background:var(--subtle);border-radius:7px 7px 0 0;border-bottom:1px solid var(--line);flex:0 0 auto}
.outline .tabs{margin:0 9px}
.tabs button{font-size:12.5px;color:var(--body-2);border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:6px 6px 0 0;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--blue);font-weight:600;border-bottom-color:var(--blue)}

/* Outline */
.o-tools{display:flex;gap:9px;margin:12px 9px 12px 10px}
.field{flex:1;display:flex;align-items:center;gap:7px;border:1px solid var(--line-input);border-radius:6px;padding:0 9px;height:28px;color:var(--muted);min-width:0}
.field input{border:0;outline:0;flex:1;min-width:0;font-size:11.5px;background:transparent;color:var(--ink)}
.field:focus-within{border-color:var(--blue-border)}
.plus{width:27px;height:27px;border-radius:5px;background:var(--plus);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.plus:hover{background:#767e90}
.tree{overflow-y:auto;padding:0 0 12px 10px;flex:1;min-height:0;scrollbar-width:thin}
.part{display:flex;align-items:center;height:27px;margin-top:14px;font-size:12px;font-weight:600;color:var(--ink);position:relative}
.part.first{margin-top:10px}
.part .tog{display:flex;align-items:center;gap:9px;flex:1;text-align:left;height:27px;padding-left:3px}
.part .tog svg{transition:transform .15s}
.part .tog[aria-expanded="false"] svg{transform:rotate(-90deg)}
.more{color:var(--muted);font-weight:700;letter-spacing:1px;margin-right:9px;padding:0 4px;border-radius:4px;height:22px}
.more:hover{background:var(--subtle)}
.row{display:flex;align-items:center;gap:13px;width:100%;height:27px;padding-left:10px;border-radius:4px 0 0 4px;font-size:11.5px;color:var(--ink-2);text-align:left}
.row.top{padding-left:8px;gap:12px}
.row:hover{background:var(--hover)}
.row[aria-current="true"]{background:var(--row-active);color:var(--row-active-ink)}
.row .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{color:#8A91A1;font-size:10px;margin-right:14px;letter-spacing:1px}
.empty-note{padding:16px 10px;color:var(--muted);font-size:12px}
.menu{position:absolute;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-menu);padding:5px;min-width:170px}
.menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 9px;border-radius:5px;font-size:12.5px;font-weight:400;color:var(--body)}
.menu button:hover,.menu button.on{background:var(--subtle)}
.menu button[aria-checked="true"]{color:var(--blue);font-weight:600}
.ol-list{overflow-y:auto;padding:8px 9px 12px;flex:1}
.ol-part{font-size:11px;letter-spacing:1px;color:var(--muted);font-weight:600;margin:12px 4px 6px;text-transform:uppercase}
.ol-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--divider);font-size:11.5px;text-align:left;width:100%}
.ol-row .w{color:var(--muted);font-variant-numeric:tabular-nums}
.st{font-size:10px;padding:1px 6px;border-radius:999px;font-weight:500}
.st.draft{background:var(--subtle);color:var(--body)}
.st.review{background:var(--blue-soft);color:var(--blue)}
.st.empty{background:var(--amber-tile);color:var(--amber-ink)}
.notes{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.notes textarea{flex:1;resize:none;border:1px solid var(--line-input);border-radius:6px;padding:10px;font-size:12.5px;line-height:1.55;outline:0;min-height:200px}
.notes textarea:focus{border-color:var(--blue-border)}
.notes small{color:var(--muted)}

/* Editor */
.ed-head{height:48px;display:flex;align-items:center;padding:0 16px 0 7px;border-bottom:1px solid var(--divider);flex:0 0 auto;gap:18px}
.ed-head h2{margin:0;font-size:14.5px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc{color:var(--muted-2);font-size:11.5px;font-variant-numeric:tabular-nums}
.saved{display:flex;align-items:center;gap:7px;color:var(--green);font-size:11.5px;font-weight:500;min-width:56px}
.saved.saving{color:var(--muted-2)}
.toolbar{height:47px;display:flex;align-items:center;padding:0 9px 0 8px;border-bottom:1px solid var(--divider);color:var(--body);flex:0 0 auto;position:relative;overflow-x:auto;scrollbar-width:none}
.tb{width:29px;height:29px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--body);flex:0 0 auto}
.tb:hover{background:var(--subtle)}
.tb.on{background:var(--blue-soft);color:var(--blue)}
.tb.wide{width:36px;gap:3px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:0 0 auto}
.para{width:95px;height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 9px;border:1px solid var(--line);border-radius:6px;background:var(--hover);font-size:11.5px;margin-right:10px;flex:0 0 auto}
.tb-more{border:1px solid var(--line);margin-left:auto}
.linkbar{position:absolute;z-index:20;display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-menu);padding:6px}
.linkbar input{width:220px;height:28px;border:1px solid var(--line-input);border-radius:5px;padding:0 8px;font-size:12px;outline:0}
.btn{height:28px;padding:0 12px;border-radius:5px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.pri{background:var(--blue);color:#fff}.btn.pri:hover{background:var(--blue-hover)}
.btn.sec{border:1px solid var(--line);background:var(--surface);color:var(--body)}.btn.sec:hover{background:var(--subtle)}
.ed-scroll{flex:1;min-height:0;overflow-y:auto;position:relative;scrollbar-width:thin}
.doc{padding:30px 26px 40px 21px;font-family:var(--serif);color:var(--body);font-size:17px;line-height:24px;outline:0;min-height:100%}
.doc h1{margin:0 0 28px;font-size:31px;line-height:38px;font-weight:700;color:var(--ink);letter-spacing:-.3px;text-wrap:balance}
.doc h2{margin:0 0 14px;font-size:21.5px;line-height:28px;font-weight:600;color:var(--ink)}
.doc h3{margin:0 0 10px;font-size:18px;line-height:26px;font-weight:600;color:var(--ink)}
.doc p{margin:0 0 18px}
.doc p.ph:empty::before{content:attr(data-placeholder);color:var(--muted)}
.doc blockquote{margin:0 0 18px;padding-left:16px;border-left:3px solid var(--line-input);color:var(--body-2);font-style:italic}
.doc pre{font:13px/1.5 ui-monospace,Menlo,monospace;background:var(--subtle);padding:12px;border-radius:6px;margin:0 0 18px;white-space:pre-wrap}
.doc ul,.doc ol{margin:0 0 18px;padding-left:24px}
.doc a{text-decoration:underline}
.doc table{border-collapse:collapse;margin:0 0 18px;font-size:15px}
.doc td{border:1px solid var(--line-input);padding:6px 10px;min-width:90px}
.doc figure{margin:0 0 18px;height:120px;border:1px dashed var(--line-input);border-radius:6px;display:flex;align-items:center;justify-content:center;font:12px var(--ui);color:var(--muted)}
.doc mark{background:var(--mark);color:inherit;border-bottom:1.5px solid var(--mark-line);cursor:pointer}
.doc mark.active{background:#C4DAFC}
.doc .applied{background:var(--applied);transition:background 1.6s}
.doc .applied.fade{background:transparent}
.callout{width:400px;max-width:100%;min-height:99px;background:var(--callout);border:1px solid var(--callout-line);border-radius:7px;padding:14px 16px 12px 13px;display:flex;gap:11px;margin:0 0 26px;font-family:var(--ui)}
.callout .ct{font-weight:600;font-size:14px;color:var(--ink);margin-bottom:9px}
.callout .cb{font-size:10px;line-height:15.5px;color:var(--body-2);outline:0}
.pop{position:absolute;width:184px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-pop);padding:10px 11px 11px;font-family:var(--ui);z-index:10}
.pop .ph{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.av{width:26px;height:26px;border-radius:50%;background:#3D6FE6;color:#fff;font-size:10.5px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.pop .pt{font-weight:600;font-size:11px;color:var(--ink)}
.pop .ps{font-size:10.5px;color:var(--muted-2)}
.pop .pd{width:8px;height:8px;border-radius:50%;background:var(--violet);margin-left:auto;margin-right:3px}
.pop p{margin:0 0 12px;font-size:12px;line-height:18px;color:var(--body)}
.pop .pa{display:flex;gap:9px}
.pop .pa .btn.pri{width:82px}.pop .pa .btn.sec{width:72px;font-weight:400;font-size:11.5px}

/* AI panel */
.run{margin-top:17px;width:100%;height:33px;border-radius:6px;background:linear-gradient(90deg,var(--violet-a),#7B55F2 60%,var(--violet-b));color:#fff;display:flex;align-items:center;font-size:12.5px;font-weight:500;flex:0 0 auto;position:relative}
.run .go{flex:1;display:flex;align-items:center;gap:10px;height:100%;padding-left:12px;text-align:left}
.run .scope{width:36px;height:100%;display:flex;align-items:center;justify-content:center;border-left:1px solid rgba(255,255,255,.18)}
.run.busy{opacity:.92}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
.spin.dark{border-color:var(--line-strong);border-top-color:var(--blue)}
@keyframes sp{to{transform:rotate(360deg)}}
.ai-body{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;margin:0 -13px;padding:0 13px 12px}
.sec-h{display:flex;align-items:center;margin:17px 0 10px}
.sec-h h3{margin:0;font-size:14px;font-weight:600;flex:1;color:var(--ink)}
.sec-h a,.sec-h .lnk{font-size:11px;font-weight:500;color:var(--blue);display:flex;align-items:center;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.tile{height:62px;border-radius:6px;display:flex;gap:11px;padding:10px 0 0 12px;text-align:left}
.tile:hover{filter:brightness(.985)}
.disc{width:25px;height:25px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.tile .v{font-size:17px;font-weight:600;line-height:22px;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--body-2)}
.agents-h{display:flex;align-items:center;margin:24px 0 3px;padding-bottom:6px;border-bottom:1px solid var(--divider)}
.agents-h h3{margin:0;font-size:14px;font-weight:600;flex:1}
.agent{display:flex;align-items:center;height:48px;gap:18px;padding:0 9px 0 6px;border-bottom:1px solid var(--divider);text-align:left;width:100%}
.agent:hover{background:var(--hover)}
.agent.off{opacity:.5}
.atile{width:31px;height:31px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.agent .nm{display:block;font-size:12.5px;font-weight:500;color:var(--ink);line-height:17px}
.agent .ds{display:block;font-size:11.5px;color:var(--muted);line-height:17px}
.agent .txt{flex:1;min-width:0}
.ok{width:17px;height:17px;border-radius:50%;background:var(--green-check);display:flex;align-items:center;justify-content:center;margin-right:10px;color:#fff}
.cnt{width:17px;height:17px;border-radius:50%;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-right:10px;color:#fff}
.switch{width:30px;height:17px;border-radius:999px;background:var(--line-strong);position:relative;margin-right:10px;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--blue)}
.switch[aria-checked="true"]::after{left:15px}
.back{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--blue);font-weight:500;margin:16px 0 8px}
.finding{border:1px solid var(--line);border-radius:8px;padding:10px 11px;margin-bottom:8px}
.finding .ft{font-size:12.5px;color:var(--ink);margin-bottom:4px}
.finding .fm{font-size:11px;color:var(--muted);margin-bottom:8px}
.finding .fa{display:flex;gap:6px}
.finding .btn{height:26px;font-size:11.5px;padding:0 10px}
.finding.done{opacity:.55}
.finding.done .fa{display:none}
.clean{padding:18px 4px;color:var(--muted);font-size:12.5px}
.cmt{border:1px solid var(--line);border-radius:8px;padding:11px;margin-top:10px}
.cmt.resolved{opacity:.55}
.cmt-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cmt-h b{font-size:12px;font-weight:600}
.cmt-h span{font-size:11px;color:var(--muted)}
.quote{font-family:var(--serif);font-size:12.5px;color:var(--body-2);border-left:2px solid var(--mark-line);padding-left:8px;margin:4px 0 8px}
.cmt p{margin:0 0 8px;font-size:12.5px;color:var(--body)}
.reply{font-size:12px;color:var(--body);background:var(--subtle);border-radius:6px;padding:6px 8px;margin-bottom:6px}
.cmt form{display:flex;gap:6px}
.cmt form input{flex:1;min-width:0;height:28px;border:1px solid var(--line-input);border-radius:5px;padding:0 8px;font-size:12px;outline:0}
.chk{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--divider);font-size:12.5px}
.chk .cl{flex:1}
.chk .cv{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.ri{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--divider)}
.ri .rt{flex:1;min-width:0}
.ri b{display:block;font-size:12px;font-weight:500}
.ri span{font-size:11px;color:var(--muted)}

/* Bottom cards */
.card{padding:11px 11px 0;overflow:hidden;position:relative}
.card h3{margin:0;font-size:13px;font-weight:600;color:var(--ink)}
.card-h{display:flex;align-items:center;height:24px;margin-bottom:11px;gap:4px}
.card-h h3{flex:1}
.addb{height:22px;width:45px;border:1px solid var(--blue-border);border-radius:5px;color:var(--blue);font-size:10.5px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:4px}
.addb:hover{background:var(--blue-soft)}
.seg{display:flex;height:26px;background:var(--subtle);border-radius:5px;margin-bottom:6px;font-size:10px}
.seg button{flex:1;color:var(--body);border-bottom:2px solid transparent}
.seg button:first-child{flex:0 0 36px}
.seg button[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue);font-weight:500;border-bottom-color:var(--blue);border-radius:5px 5px 0 0}
.rs-list{overflow-y:auto;height:126px;scrollbar-width:none}
.rs{display:flex;align-items:center;gap:13px;height:42px;padding-left:11px;border-bottom:1px solid var(--divider)}
.rs b{display:block;font-size:10px;font-weight:500;color:var(--ink);line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs span{display:block;font-size:9.5px;color:var(--muted-2);line-height:14px}
.rs .rt{min-width:0}
.rs-form{display:flex;flex-direction:column;gap:6px;padding:4px 0}
.rs-form input,.rs-form select{height:26px;border:1px solid var(--line-input);border-radius:5px;padding:0 7px;font-size:11px;outline:0;background:var(--surface)}
.rs-form .row2{display:flex;gap:6px}
.rs-form .btn{height:26px;font-size:11px}
.pv-h{display:flex;align-items:center;height:28px;margin-bottom:9px}
.pv-h h3{flex:1}
.vbtn{width:24px;height:24px;border:1px solid var(--line);border-radius:5px;display:flex;align-items:center;justify-content:center;margin-right:4px;color:var(--body)}
.vbtn[aria-pressed="true"]{border-color:var(--blue-border);background:var(--blue-soft);color:var(--blue)}
.sel{height:24px;border:1px solid var(--line);border-radius:5px;font-size:10px;color:var(--body);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 8px;margin-left:7px;position:relative}
.spread-box{display:flex;justify-content:center;align-items:flex-start;height:198px}
.spread{position:relative;overflow:hidden;transition:width .2s}
.spread img{display:block;height:100%;width:auto;max-width:none}
.cover-card{padding:9px 11px 0}
.cover-card h3{height:28px;display:flex;align-items:center}
.cover-img{display:block;width:125px;height:161px;margin:5px 0 0 20px;box-shadow:0 2px 6px rgba(17,26,46,.18);object-fit:cover;transition:filter .25s}
.dots{display:flex;justify-content:center;gap:5px;margin-top:16px}
.dots button{width:5px;height:5px;border-radius:50%;background:var(--line-strong)}
.dots button[aria-current="true"]{background:var(--blue)}
.cv-wrap{position:relative;min-width:0}
.cv-wrap>.panel{height:100%}
.arrow{position:absolute;top:103px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);box-shadow:0 1px 4px rgba(17,26,46,.12);display:flex;align-items:center;justify-content:center;z-index:2;color:var(--ink-2)}
.arrow.l{left:-8px}.arrow.r{right:-1px}
.ex{padding:7px 9px 0 10px;display:flex;flex-direction:column}
.ex h3{height:24px;display:flex;align-items:center}
.fsel{width:100%;height:23px;margin:1px 0 6px;border:1px solid var(--line-input);border-radius:5px;font-size:10.5px;color:var(--body);display:flex;align-items:center;justify-content:space-between;padding:0 9px;position:relative}
.fsel.err{border-color:var(--red)}
.fmt{display:flex;align-items:center;gap:13px;height:30px;padding-left:12px;border-radius:5px;text-align:left;width:100%}
.fmt:hover{background:var(--hover)}
.fmt[aria-pressed="true"]{background:var(--blue-soft)}
.ftile{width:19px;height:19px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto}
.fmt b{display:block;font-size:9.5px;font-weight:600;color:var(--ink);line-height:12px}
.fmt span{display:block;font-size:9px;color:var(--muted-2);line-height:12px}
.morefmt{display:flex;align-items:center;gap:15px;height:20px;padding-left:13px;font-size:9.5px;font-weight:500;color:var(--ink)}
.morefmt i{font-style:normal;font-weight:700;letter-spacing:1px;color:var(--body-2)}
.vx{width:100%;height:26px;margin-top:4px;border-radius:5px;background:var(--blue);color:#fff;font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:9px}
.vx:hover{background:var(--blue-hover)}
.vx.done{background:var(--green)}
.exstat{position:absolute;inset:31px 9px 38px 10px;background:var(--surface);display:flex;flex-direction:column;gap:5px;padding-top:4px}
.exstat .li{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--body);height:20px}
.exstat .sum{font-size:11px;font-weight:600;margin-top:4px}
.mini-ok{width:14px;height:14px;border-radius:50%;background:var(--green-check);color:#fff;display:flex;align-items:center;justify-content:center}
.mini-warn{width:14px;height:14px;border-radius:50%;background:var(--amber-badge);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
.mini-wait{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-strong)}

/* Overlays */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50}
.palette{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(560px,calc(100vw - 32px));background:var(--surface);border-radius:12px;box-shadow:var(--shadow-menu);z-index:60;overflow:hidden}
.palette .pin{display:flex;align-items:center;gap:10px;padding:0 14px;height:48px;border-bottom:1px solid var(--line);color:var(--muted)}
.palette input{flex:1;border:0;outline:0;font-size:15px;color:var(--ink);background:transparent}
.palette ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow-y:auto}
.palette li button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:6px;text-align:left;font-size:13px}
.palette li button.on{background:var(--blue-soft);color:var(--blue)}
.palette .k{margin-left:auto;font-size:11px;color:var(--muted)}
.pgroup{font-size:10.5px;letter-spacing:1px;color:var(--muted);padding:8px 10px 4px;text-transform:uppercase}
.notif{position:absolute;top:50px;right:62px;width:300px;z-index:40}
.notif .ni{display:flex;gap:10px;padding:9px;border-radius:6px;font-size:12px;color:var(--body);text-align:left;width:100%}
.notif .ni:hover{background:var(--subtle)}
.notif .ni small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:70;align-items:center;pointer-events:none}
.toast{background:var(--toast);color:var(--toast-ink);padding:10px 16px;border-radius:8px;font-size:12.5px;box-shadow:var(--shadow-menu);animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
.proto-tag{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:45;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:11px;color:var(--muted);display:none}

/* Responsive */
@media (max-width:1279px){
  .only-wide{display:none!important}
  .only-narrow.ai-t{display:flex!important}
  .work{grid-template-columns:268px minmax(0,1fr)}
  .bottom{grid-column:2/3;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:236px 236px}
  .work{grid-template-rows:minmax(0,1fr) auto}
  .ai{position:fixed;top:54px;right:0;bottom:0;width:min(392px,100vw);z-index:55;border-radius:10px 0 0 0;transform:translateX(105%);transition:transform .2s;box-shadow:var(--shadow-menu)}
  .ai.open{transform:none}
  .topnav{gap:22px;overflow-x:auto;scrollbar-width:none}
  .brand{width:auto;padding-right:28px}
}
@media (max-width:959px){
  .app{height:auto;min-height:100%}
  .only-narrow.side-t{display:flex!important}
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:54px;left:0;bottom:0;width:260px;z-index:55;transform:translateX(-105%);transition:transform .2s;border-radius:0}
  .side.open{transform:none}
  .work{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;padding:12px 16px 24px}
  .outline{grid-row:auto;grid-column:1;max-height:340px}
  .editor{grid-column:1;grid-row:auto;height:70vh;min-height:480px}
  .bottom{grid-column:1;grid-row:auto}
  .topnav,.search span,.search kbd{display:none}
  .search{width:36px;padding:0;justify-content:center;border:0}
  .brand{padding-left:8px;flex:1 1 auto;min-width:0;gap:10px}
  .brand b{font-size:17px;overflow:hidden;text-overflow:ellipsis}
  .hdr{min-width:0}
  .notif{right:8px;width:min(300px,calc(100vw - 16px))}
  .hdr-right{gap:6px;padding-right:12px}
}
@media (max-width:560px){
  .bottom{grid-template-columns:minmax(0,1fr);grid-template-rows:none}
  .bottom>*{height:236px}
  .doc{padding:22px 16px 32px}
  .doc h1{font-size:26px;line-height:32px}
  .callout{width:100%}
}

.ob-opt{text-align:left;border:1px solid var(--line-input);border-radius:10px;padding:12px 14px}.ob-opt b{display:block;font-size:13.5px}.ob-opt span{font-size:12.5px;color:var(--muted)}
.ob-opt.on{border-color:var(--blue);background:var(--blue-soft)}
.tour-hole{position:fixed;z-index:85;border-radius:10px;box-shadow:0 0 0 9999px rgba(15,23,42,.55);pointer-events:none;transition:all .2s}
.tour-card{position:fixed;z-index:86;background:var(--surface);border-radius:12px;padding:16px;box-shadow:var(--shadow-menu);display:flex;flex-direction:column;gap:6px}
.tour-card h2{margin:0;font-size:15px}.tour-card p{margin:0 0 6px;font-size:13px;color:var(--body);line-height:1.5}
.ni.unread{background:var(--blue-soft)}
.presence{display:inline-flex;align-items:center;margin-right:2px;position:relative}
.av.pr{width:24px;height:24px;font-size:9px;border:2px solid var(--surface);margin-left:-6px}
.pr-dot{position:absolute;right:-1px;bottom:0;width:8px;height:8px;border-radius:50%;background:var(--green-check);border:2px solid var(--surface)}
.new-cmt{margin-top:12px;background:var(--subtle)}
.mentions{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.mentions button{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:5px;font-size:12px;text-align:left;background:var(--surface);border:1px solid var(--line)}
.mentions button:hover{background:var(--blue-soft)}
.prof{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.prefs td{padding:8px 10px}.prefs input{width:16px;height:16px}
.steps-ol{margin:0 0 12px;padding-left:18px;font-size:13px;line-height:1.7}
.key{font-size:13px;letter-spacing:1px;background:var(--subtle);padding:2px 8px;border-radius:4px}
.art{border-bottom:1px solid var(--divider);padding:10px 0}
.art summary{cursor:pointer;font-size:13.5px;font-weight:500;list-style:none;display:flex;justify-content:space-between}
.art summary::after{content:"+";color:var(--muted)}.art[open] summary::after{content:"–"}
.art p{margin:8px 0;font-size:13px;line-height:1.6;color:var(--body)}
.helpful{font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center}

  const el=$('popEl'), sc=$('edScroll'), W=sc.clientWidth, base=sc.getBoundingClientRect();
  const mr=mk.getBoundingClientRect(); const top0=mr.top-base.top+sc.scrollTop;
  // dock beside the next callout when there is room (mockup position), else under the mark
  let blk=mk.closest('p,h1,h2,h3,li,blockquote'); let co=null,n=blk;

function applySugg(id,apply){

/* ---------- actions ---------- */
let savedRange=null;
const A={
  route(t){S.route=t.dataset.v;S.menu=null;renderTop();renderWork();},
  toggleSide(){$('side').classList.toggle('open');},
  toggleAI(){$('ai').classList.toggle('open');},
  side(t){
    const k=t.dataset.v; S.side=k; S.route='Writing Studio'; $('side').classList.remove('open'); renderTop(); renderWork();
    const flash=id=>{const el=$(id);el.scrollIntoView({block:'nearest',behavior:'smooth'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');};
    if(k==='manuscript'){S.leftTab='Manuscript';renderOutline();}
    else if(k==='notes'){S.leftTab='Notes';renderOutline();flash('outline');}
    else if(k==='research'){flash('research');}
    else if(k==='refs'){S.rightTab='Research';S.agentView=null;renderAI();$('ai').classList.add('open');flash('ai');}
    else if(k==='comments'){S.rightTab='Comments';renderAI();$('ai').classList.add('open');flash('ai');}
    else if(k==='suggestions'){const s=openSugg()[0];if(s){S.pop=s.id;if(s.ch!==S.chapter){S.chapter=s.ch;renderOutline();loadChapter();}else renderPop();const m=$('doc').querySelector(`mark[data-sid="${s.id}"]`);m&&m.scrollIntoView({block:'center',behavior:'smooth'});}else toast('No open suggestions');}
    else if(k==='workflow'){S.rightTab='Checks';renderAI();$('ai').classList.add('open');flash('ai');}
    else if(k==='design'){flash('preview');}
    else if(k==='coverstudio'){flash('cover');}
    else if(k==='export'){flash('export');}
    else {S.route=SIDE.flatMap(g=>g.items).find(i=>i[0]===k)[1];renderWork();}
    renderSide();
  },
  leftTab(t){S.leftTab=t.dataset.v;renderOutline();},
  rightTab(t){S.rightTab=t.dataset.v;S.agentView=null;renderAI();},
  chapter(t){saveCurrent();S.chapter=t.dataset.v;renderOutline();loadChapter();if(S.leftTab==='Outline'){S.leftTab='Manuscript';renderOutline();}},
  togglePart(t){const id=t.dataset.v;S.collapsed[id]=!S.collapsed[id];S.menu=null;renderOutline();},
  partMenu(t){S.menu=S.menu==='part:'+t.dataset.v?null:'part:'+t.dataset.v;renderOutline();},
  addChapter(t){
    const pid=t.dataset.v||chap(S.chapter).part||'p1';
    const kids=CH.filter(c=>c.part===pid); const last=kids[kids.length-1];
    const nums=CH.map(c=>+(c.title.match(/^(\d+)\./)||[])[1]||0); const n=PARTS.find(p=>p.id===pid).matter?null:Math.max(...nums)+1;
    const c={id:'n'+Date.now(),title:n?`${n}. Untitled Chapter`:'Untitled Section',part:pid,words:0,status:'draft',mark:'',html:null,initial:null,now:null};
    CH.splice(CH.indexOf(last)+1,0,c); S.collapsed[pid]=false; S.menu=null; saveCurrent(); S.chapter=c.id; S.q='';
    renderOutline(); loadChapter(); toast('Chapter added');
    const h1=$('doc').querySelector('h1'); if(h1){const r=document.createRange();r.selectNodeContents(h1);const s=getSelection();s.removeAllRanges();s.addRange(r);$('doc').focus();}
  },
  fmt(t){

document.addEventListener('keydown',e=>{

  if(e.key==='Escape'){S.menu=null;$('tbPop').innerHTML='';renderNotif();renderAI();renderPreview();renderExport();$('ai').classList.remove('open');$('side').classList.remove('open');if(S.pop){S.pop=null;renderPop();}}

});
window.addEventListener('resize',()=>renderPop());
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>renderPop());

function checksBody(){
  const all=allText(),imgs=CH.reduce((n,c)=>n+((c.id===S.chapter?$('doc').innerHTML:chapterHTML(c)).match(/<img(?![^>]*alt="[^"]+")/g)||[]).length,0);

}

function palItems(){
  const q=PAL.q.toLowerCase();
  const acts=[['Run full editorial review',()=>{if(S.route!=='Writing Studio')go('Writing Studio','manuscript');A.runReview(null);}],['Validate & export',()=>{go('Writing Studio','manuscript');if(!S.format)S.format='pdf';A.validate();}],['New book',()=>{S.newBook=true;go('My Books',null);}],['Invite a team member',()=>go('Team Members','team')],['Keyboard shortcuts',()=>A.shortcuts()]].map(([l,f])=>({l,f,g:'Actions'}));
  const pages=[...TOPNAV.map(n=>[n,SIDE_OF_TOP[n]??null]),...BOOK_PAGES.map(n=>[n,Object.keys(PAGE_OF_SIDE).find(k=>PAGE_OF_SIDE[k]===n)]),['Cover Studio','coverstudio']].map(([n,s])=>({l:n,f:()=>go(n,s),g:'Go to'}));
  const chs=CH.map(c=>({l:c.title,f:()=>{go('Writing Studio','manuscript');A.chapter({dataset:{v:c.id}});},g:'Chapters'}));
  return [...acts,...pages,...chs].filter(x=>!q||x.l.toLowerCase().includes(q)).slice(0,14);
}

function exportPreview(id){

  const ext={pdf:'pdf',lp:'pdf',epub:'epub',kpf:'kpf',docx:'docx',html:'html',md:'md'}[id];
  let body;

    S.exportText=txt; body=`<pre class="code">${esc(txt)}</pre>`;

  }
  S.modal={title:`${f.name} · ${slug}.${ext}`,wide:true,body:`<div class="xmeta"><span>${fmtN(bookWords())} words</span><span>${CH.length} sections</span><span>${TRIMS[S.trim]}</span><span>Generated ${new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</span></div>${body}`,

function dzPreview(){
  const L=BOOK.layout,tr=[[6,9],[5.5,8.5],[5,8],[6,9]][S.trim],ph=320,pw=Math.round(ph*tr[0]/tr[1]),k=pw/(tr[0]*72),fs=L.size*k*1.05,mg=Math.round({Narrow:.5,Standard:.75,Wide:1}[L.margins]*72*k),gap=10;

  const W=pw*2+gap;
  return `<div class="dz-spread" style="width:${W}px;height:${ph}px;font-family:${FONTS[L.font]}"><div class="dz-pg" style="left:0;width:${pw}px"></div><div class="dz-pg" style="left:${pw+gap}px;width:${pw}px"></div>

function rng(seed){let x=seed;return()=>{x=(x*16807)%2147483647;return x/2147483647;};}
function salesData(days){
  const live=CHANNELS.filter(c=>BOOK.channels[c[0]].st==='live'),r=rng(97),out=[];
  for(let i=days-1;i>=0;i--){const d=new Date(Date.now()-i*864e5),per={};live.forEach(c=>{per[c[0]]=Math.round(r()*(c[2]==='print'?5:8)+(c[2]==='print'?1:2));});out.push({d,per,units:Object.values(per).reduce((a,b)=>a+b,0)});}
  return {live,out};
}
function barChart(pts,{h=170,fmt=v=>v,label=p=>p.l}={}){
  const max=Math.max(1,...pts.map(p=>p.v)),nice=Math.ceil(max/5)*5||5,n=pts.length,W=n*10;
  const bars=pts.map((p,i)=>{const bh=Math.max(p.v?1.5:0,(p.v/nice)*h);return `<rect x="${i*10+1.5}" y="${h-bh}" width="7" height="${bh}" class="bar-r${p.hl?' hl':''}"/><rect x="${i*10}" y="0" width="10" height="${h}" fill="transparent" data-tip="${esc(label(p))}: ${esc(fmt(p.v))}"/>`;}).join('');
  return `<div class="chart"><div class="yax" style="height:${h+12}px"><span>${fmt(nice)}</span><span>${fmt(nice/2)}</span><span>0</span></div><div class="plot"><div class="gl" style="top:0"></div><div class="gl" style="top:50%"></div><svg viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" style="height:${h}px" role="img" aria-label="Bar chart, ${n} bars, peak ${fmt(max)}">${bars}</svg><div class="xax"><span>${esc(pts[0]?.l||'')}</span><span>${esc(pts[n-1]?.l||'')}</span></div></div></div>`;
}

function genCourse(){
  const co=courseState(),allH2=[];
  const parsed=CH.map(c=>{const d=document.createElement('div');d.innerHTML=c.id===S.chapter&&$('doc').innerHTML?$('doc').innerHTML:chapterHTML(c);const h2=[...d.querySelectorAll('h2')].map(n=>n.textContent.replace(/^[\d.]+\s*/,''));h2.forEach(h=>allH2.push(h));return {c,h2,take:d.querySelector('.callout .cb')?.textContent.trim(),paras:[...d.querySelectorAll('p')].map(p=>p.textContent.trim()).filter(Boolean)};});
  const pool=[...allH2,...CH.map(c=>c.title.replace(/^\d+\.\s*/,''))];
  co.modules=PARTS.filter(p=>!p.matter).map(p=>({id:p.id,title:p.title,lessons:parsed.filter(x=>x.c.part===p.id).map((x,i)=>{
    const t=x.c.title.replace(/^\d+\.\s*/,''),quiz=[];
    if(x.h2.length){const wrong=shuffleWith(pool.filter(o=>!x.h2.includes(o)&&o!==t),i+3).slice(0,3);const opts=shuffleWith([x.h2[0],...wrong],i+7);quiz.push({q:`Which topic is part of “${t}”?`,opts,a:opts.indexOf(x.h2[0])});}
    if(x.take)quiz.push({q:`True or false: ${x.take}`,opts:['True','False'],a:0});
    return {id:x.c.id,title:t,mins:Math.max(5,Math.round(chWords(x.c)/220)),objectives:x.h2.length?x.h2:['Key ideas from this chapter'],excerpt:x.paras.slice(0,2),quiz};
  })})).filter(m=>m.lessons.length);
}

function speak(key,text,voice){
  const syn=window.speechSynthesis;
  if(!syn||typeof SpeechSynthesisUtterance==='undefined'){toast('Voice preview isn’t available in this browser');return;}
  try{
    if(S.speaking===key){syn.cancel();S.speaking=null;rp();return;}
    syn.cancel();const a=audioState();let tx=text;a.dict.forEach(d=>{tx=tx.replace(new RegExp(`\\b${d.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b`,'g'),d.s);});
    const u=new SpeechSynthesisUtterance(tx),vs=syn.getVoices().filter(v=>/^en/i.test(v.lang)),idx=VOICES.indexOf(voice);
    if(vs.length)u.voice=vs[idx%vs.length];u.pitch=voice.pitch;u.rate=a.rate;

/* ---------- Accessibility ---------- */
function lum(hex){const c=hex.replace('#','').match(/../g).map(x=>{const v=parseInt(x,16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});return .2126*c[0]+.7152*c[1]+.0722*c[2];}
const contrast=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);};
function a11yChecks(){
  const imgs=[],tables=[],links=[];let order=true;
  CH.forEach(c=>{const d=document.createElement('div');d.innerHTML=htmlOf(c);d.querySelectorAll('img').forEach((im,i)=>imgs.push({c,i,src:im.getAttribute('src'),alt:im.getAttribute('alt')||''}));d.querySelectorAll('table').forEach(t=>tables.push({c,th:!!t.querySelector('th')}));d.querySelectorAll('a').forEach(a=>links.push({c,bad:a.textContent.trim()===a.getAttribute('href')||/^(click here|here|link)$/i.test(a.textContent.trim())}));let last=0;d.querySelectorAll('h1,h2,h3').forEach(h=>{const l=+h.tagName[1];if(l>last+1)order=false;last=l;});});
  const p=PALETTES[BOOK.design.palette],cr=BOOK.cover==='design'&&!BOOK.design.art?contrast(p.ink,p.sky[0]):null;
  return {imgs,list:[
    ['Heading levels in order',order,order?'Every chapter steps H1 → H2 → H3':'A chapter skips a heading level'],
    ['Images have alt text',imgs.every(x=>x.alt.trim()),`${imgs.filter(x=>!x.alt.trim()).length} of ${imgs.length} missing`],
    ['Language is set',!!BOOK.language,BOOK.language],
    ['Tables have header rows',tables.every(t=>t.th),tables.length?`${tables.filter(t=>!t.th).length} of ${tables.length} without headers`:'No tables'],
    ['Link text is descriptive',links.every(l=>!l.bad),links.length?`${links.filter(l=>l.bad).length} of ${links.length} need better text`:'No links'],
    ['Cover title contrast',cr==null||cr>=4.5,cr==null?'Original artwork':`${cr.toFixed(1)}:1 (needs 4.5:1)`]]};
}

function diffHTML(a,b){
  const A0=words(a),B0=words(b),n=A0.length,m=B0.length;
  if(n*m>4e6)return '<p class="muted">This chapter is too long to compare here.</p>';
  const dp=Array.from({length:n+1},()=>new Uint32Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=A0[i]===B0[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0,out=[],adds=0,dels=0;const w=x=>x==='¶'?'<br>':esc(x)+' ';
  while(i<n&&j<m){if(A0[i]===B0[j]){out.push(w(A0[i]));i++;j++;}else if(dp[i+1][j]>=dp[i][j+1]){out.push(`<del>${w(A0[i])}</del>`);i++;dels++;}else{out.push(`<ins>${w(B0[j])}</ins>`);j++;adds++;}}
  while(i<n){out.push(`<del>${w(A0[i++])}</del>`);dels++;}while(j<m){out.push(`<ins>${w(B0[j++])}</ins>`);adds++;}
  return `<p class="muted" style="margin:0 0 10px;font-size:12px"><span class="d-add">+${adds} words</span> · <span class="d-del">−${dels} words</span></p><div class="diff">${out.join('').replace(/(<br>)+/g,'<br><br>')}</div>`;
}

    clientAdd(){const n=$('clN').value.trim(),em=$('clE').value.trim();if(!n||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){toast('Enter a client name and a valid email');return;}CLIENTS.push({id:'k'+Date.now(),name:n,email:em,books:[],appr:[]});log(`Added client ${n}`);rp();toast('Client added');},

},true);

  else if(k==='launchTask'){launch().done[t.value]=t.checked;rp();}
  else if(k==='importFile'){const file=t.files[0];if(!file)return;const fr=new FileReader();fr.onload=()=>{importText(fr.result,file.name);t.value='';};fr.readAsText(file);}

function importText(txt,name){
  let parts=[];
  if(/\.html?$/i.test(name)){const d=document.createElement('div');d.innerHTML=txt.replace(/<script[\s\S]*?<\/script>/gi,'');let cur=null;[...d.querySelectorAll('h1,h2,p,li')].forEach(n=>{if(n.tagName==='H1'){cur={title:n.textContent.trim(),body:[]};parts.push(cur);}else{if(!cur){cur={title:name.replace(/\.[^.]+$/,''),body:[]};parts.push(cur);}cur.body.push(n.tagName==='H2'?`<h2>${esc(n.textContent)}</h2>`:`<p>${esc(n.textContent)}</p>`);}});}
  else{const blocks=/^#\s/m.test(txt)?txt.split(/^#\s+/m).filter(s=>s.trim()):[name.replace(/\.[^.]+$/,'')+'\n'+txt];parts=blocks.map(b=>{const [first,...rest]=b.split('\n');return {title:first.trim(),body:rest.join('\n').split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean).map(p=>p.startsWith('## ')?`<h2>${esc(p.slice(3))}</h2>`:`<p>${esc(p.replace(/\n/g,' '))}</p>`)};});}
  parts=parts.filter(p=>p.title);if(!parts.length){toast('No chapters found in that file');return;}
  const pid='imp'+Date.now();PARTS.push({id:pid,title:'Imported'});
  parts.forEach((p,i)=>CH.push({id:pid+'c'+i,title:p.title,part:pid,words:0,status:'draft',mark:'',html:`<h1>${esc(p.title)}</h1>${p.body.join('')||'<p class="ph" data-placeholder="Start writing…"></p>'}`,initial:null,now:null}));
  CH.filter(c=>c.part===pid).forEach(c=>{const d=document.createElement('div');d.innerHTML=c.html;c.words=countWords(d.textContent);});
  log(`Imported ${parts.length} chapter${parts.length===1?'':'s'} from ${name}`);renderSide();rp();toast(`Imported ${parts.length} chapter${parts.length===1?'':'s'} into “Imported”`);
}

const SKEY='publishing-studio-prototype-v1';let saveTimer=null,quotaWarned=false;
const AGENT_TPL=Object.fromEntries(BOOKS[0].data.AGENTS.map(a=>[a.id,{...a,findings:[],on:true}]));
function persist(){
  try{
    saveCurrent();

function rehydrateAgent(a){
  if(a.spec){const s=SPECIALISTS.find(x=>x.id===a.id);return {id:s.id,name:s.name,icon:s.icon,tile:s.tile,badge:s.badge,sum:s.sum,okText:s.okText,findings:a.findings,on:a.on,spec:true};}
  return {...AGENT_TPL[a.id],findings:a.findings,on:a.on};
}
function restore(){
  let raw=null;try{raw=localStorage.getItem(SKEY);}catch(e){return false;}
  if(!raw)return false;
  try{
    const d=JSON.parse(raw);if(d.v!==1)return false;
    d.books.forEach(b=>{b.data.AGENTS=b.data.AGENTS.filter(a=>a.spec?SPECIALISTS.some(s=>s.id===a.id):AGENT_TPL[a.id]).map(rehydrateAgent);});
    BOOKS.splice(0,BOOKS.length,...d.books);
    const b=BOOKS.find(x=>x.id===d.cur)||BOOKS[0];BOOK=b;({PARTS,CH,SUGG,AGENTS,COMMENTS,RESEARCH,TERMS}=b.data);
    Object.assign(ACCT,d.acct);Object.assign(STATS,d.stats);Object.assign(PROFILE,d.profile);Object.assign(PREFS,d.prefs);

    return true;
  }catch(e){return false;}
}

  twofaOn(){const sec=[...crypto.getRandomValues(new Uint8Array(10))].map(b=>'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567'[b%32]).join('').match(/.{1,4}/g).join(' ');S.modal={title:'Set up two-step verification',body:`<ol class="steps-ol"><li>Open your authenticator app and add an account.</li><li>Enter this setup key: <code class="key">${sec}</code></li><li>Type the 6-digit code the app shows.</li></ol><form class="inline" data-f="twofa"><label class="fl" for="tfC" style="flex:1;margin:0">Code<input id="tfC" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label><button class="btn pri" type="submit" style="align-self:flex-end">Verify</button></form>${S.tfErr?`<p class="err-t">${S.tfErr}</p>`:''}<p class="muted" style="font-size:12px">Prototype: any 6 digits work.</p>`,foot:'<button class="btn sec" data-a="closeModal">Cancel</button>'};renderOverlay();},
  twofaOff(){PROFILE.twofa=false;log('Turned off two-step verification');rp();toast('Two-step verification is off');},
  sessionEnd(t){const i=SESSIONS.findIndex(s=>s.id===t.dataset.v);const s=SESSIONS.splice(i,1)[0];log(`Signed out ${s.d}`);rp();toast(`Signed out of ${s.d}`);},
  delAsk(){S.delAsk=true;rp();$('delC').focus();},delCancel(){S.delAsk=false;rp();},
  resetAsk(){S.menu=null;renderAcct();S.modal={title:'Reset demo data?',body:'<p style="margin:0">This clears everything you changed in this browser and reloads the sample book.</p>',foot:'<button class="btn sec" data-a="closeModal">Cancel</button><button class="btn danger" data-a="resetGo">Reset demo</button>'};renderOverlay();},
  resetGo(){try{localStorage.removeItem(SKEY);}catch(e){}window.removeEventListener('pagehide',persist);location.reload();},
  hOpen(t){const i=+t.dataset.v;S.hOpen=S.hOpen===i?null:i;setTimeout(rp,0);},
  hVote(t){S.hVote=S.hVote||{};S.hVote[t.dataset.v]=true;rp();},
});
/* keep wrapped actions from earlier scripts working */
const _resolveComment5=A.resolveComment;

/* ---------- forms ---------- */
const okEmail=v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v);
function authError(msg){const card=document.querySelector('.auth-card');if(!card)return;let el=card.querySelector('.auth-err');if(!el){el=document.createElement('p');el.className='err-t auth-err';el.setAttribute('role','alert');el.style.margin='0';card.querySelector('button[type=submit]').before(el);}el.textContent=msg;}
window.addEventListener('submit',e=>{
  const f=e.target.dataset&&e.target.dataset.f;const H={
    authSignin(){const em=$('aiE').value.trim(),pw=$('aiP').value;if(!okEmail(em))return authError('Enter a valid email.');if(pw.length<1)return authError('Enter your password.');if(S.deleted)return authError('No account uses that email. Create one instead.');PROFILE.email=em;S.signedOut=false;S.authErr='';renderOverlay();renderAll();toast(`Signed in as ${em}`);},
    authSignup(){const n=$('auN').value.trim(),em=$('auE').value.trim(),pw=$('auP').value;const er=!n?'Enter your name.':!okEmail(em)?'Enter a valid email.':pw.length<8?'Use a password with at least 8 characters.':!$('auT').checked?'Agree to the terms to continue.':'';if(er){authError(er);return;}S.authErr='';
      Object.assign(PROFILE,{name:n,email:em,onboarded:false});S.deleted=false;S.signedOut=false;S.onboarding=true;S.ob=1;S.obPick='sample';S.obPlan='author';log(`Created account ${em}`);renderOverlay();},
    authForgot(){const em=$('afE').value.trim();if(!okEmail(em))return authError('Enter a valid email.');S.authErr='';S.resetSent=em;renderOverlay();},
    obStep(){
      if(S.ob===1){PROFILE.name=$('obN').value.trim()||PROFILE.name;PROFILE.title=$('obR').value;S.ob=2;return renderOverlay();}
      if(S.ob===2){const k=S.obPick||'sample';if(k==='new'){const t=$('obT').value.trim();if(!t)return authError('Add a working title.');S.obNew={t,g:$('obG').value,w:+$('obW').value||60000};}S.obErr='';S.ob=3;return renderOverlay();}
      const pl=S.obPlan||'author';ACCT.plan=pl;ACCT.credits=PLANS[pl].credits;PROFILE.onboarded=true;S.onboarding=false;
      if(S.obPick==='new'&&S.obNew){S.newBook=true;go('My Books',null);setTimeout(()=>{$('nbTitle').value=S.obNew.t;$('nbGenre').value=S.obNew.g;$('nbTarget').value=S.obNew.w;document.querySelector('form[data-f="newBook"] button[type=submit]').click();const b=BOOKS[BOOKS.length-1];if(b.title===S.obNew.t){A.openBook({dataset:{v:b.id}});}S.tour=null;renderOverlay();toast(`“${S.obNew.t}” is ready. Start writing.`);},50);}
      else if(S.obPick==='import'){go('Integrations',null);toast('Choose a file under “Import a manuscript”');}
      else{go('Writing Studio','manuscript');S.tour=0;}
      log(`Started the ${PLANS[pl].n} plan`);renderAll();
    },
    newComment(){const v=$('ncT').value.trim();if(!v){toast('Write a comment first');return;}const id='k'+Date.now();COMMENTS.unshift({id,who:'ME',role:'You',ch:S.chapter,quote:S.selQuote||headerLabel(chap(S.chapter)),text:v,replies:[],status:'open'});S.selQuote=null;log(`Commented on ${headerLabel(chap(S.chapter))}`);
      const ms=mentioned(v);ms.forEach(m=>simulateReply(m,id));renderAI();renderSide();toast(ms.length?`Comment posted · ${ms.map(m=>m.name).join(', ')} notified`:'Comment posted');},
    profile(){const n=$('pfN').value.trim(),em=$('pfE').value.trim();if(!n||!okEmail(em)){toast('Enter a name and a valid email');return;}Object.assign(PROFILE,{name:n,email:em,title:$('pfT').value});S.pfMsg='Saved';log('Updated profile');rp();setTimeout(()=>{S.pfMsg='';if(S.route==='Account Settings')rp();},2500);},
    password(){const c=$('pwC').value,n=$('pwN').value,r=$('pwR').value;S.pwOk=false;S.pwMsg=!c?'Enter your current password.':n.length<8?'Use at least 8 characters for the new password.':n!==r?'The new passwords don’t match.':(S.pwOk=true,'Password changed. Other devices were signed out.');if(S.pwOk){SESSIONS.splice(1);log('Changed password');}rp();},
    twofa(){const c=$('tfC').value.trim();if(!/^\d{6}$/.test(c)){S.tfErr='Enter the 6-digit code.';A.twofaOn();return;}S.tfErr='';PROFILE.twofa=true;const codes=Array.from({length:8},()=>[...crypto.getRandomValues(new Uint8Array(4))].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,8));log('Turned on two-step verification');S.modal={title:'Save your backup codes',body:`<p style="margin:0 0 10px">Use one of these if you lose your phone. Each works once.</p><pre class="code">${codes.join('\n')}</pre>`,foot:`<button class="btn sec" data-a="copyCodes">Copy codes</button><button class="btn pri" data-a="closeModal">Done</button>`};renderOverlay();rp();},
    deleteAccount(){if($('delC').value.trim()!=='DELETE'){toast('Type DELETE to confirm');return;}try{localStorage.removeItem(SKEY);}catch(e){}S.delAsk=false;S.deleted=true;S.signedOut=true;S.authMode='signup';PROFILE.onboarded=false;renderOverlay();},
    ticket(){const m=$('tkM').value.trim();if(m.length<10){S.tkErr='Tell us a bit more (at least 10 characters).';rp();return;}S.tkErr='';const t={id:'T'+Date.now(),topic:$('tkT').value,msg:m,st:'Open'};TICKETS.unshift(t);log(`Sent a support request about ${t.topic}`);rp();toast('Message sent. We usually reply within a day.');setTimeout(()=>{t.st='Answered';notify({who:'PS',col:'#0F172A',text:`Support answered your ${t.topic.toLowerCase()} question`,go:'help'});if(S.route==='Help')rp();},5000);}
  };
  if(H[f]){e.preventDefault();e.stopImmediatePropagation();H[f]();}
  else if(f==='reply'){const id=e.target.dataset.v,inp=$('rp-'+id),v=inp&&inp.value.trim();if(v){mentioned(v).forEach(m=>simulateReply(m,id));}}
},true);
A.copyCodes=()=>copyText(document.querySelector('.modal pre').textContent,'Backup codes copied');
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='ncT'||(t.id&&t.id.startsWith('rp-')))mentionScan(t);
  const k=t.dataset&&t.dataset.in;if(!k)return;
  if(k==='hQ'){S.hQ=t.value;rp();}
  else if(k==='pwMeter'){const v=t.value,sc=(v.length>=8)+(/[A-Z]/.test(v)&&/[a-z]/.test(v))+/\d/.test(v)+/[^A-Za-z0-9]/.test(v)+(v.length>=12);const lbl=['Too short','Weak','Fair','Good','Strong','Very strong'][sc];$('pwBar').style.width=(sc/5*100)+'%';$('pwBar').style.background=sc<2?'var(--red)':sc<4?'var(--amber)':'var(--green)';$('pwHint').textContent=v?lbl:'Use 8 or more characters.';}
});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.ch;if(k&&k.startsWith('pref:')){const [,ev,ch]=k.split(':');PREFS[ev][ch]=e.target.checked;toast('Notification setting saved');}});
document.addEventListener('keydown',e=>{
  if(S.tour!=null){if(e.key==='Escape')A.tourEnd();else if(e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();A.tourNext();}else if(e.key==='ArrowLeft')A.tourBack();return;}
  if(e.key==='?'&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&!e.target.isContentEditable){go('Help',null);}
},true);
/* simulated teammate activity, once per session */
setTimeout(()=>{if(BOOK.id==='b1'&&!S.signedOut)notify({who:'CA',col:'#3D6FE6',text:'Co-author is editing Chapter 2',go:'comments'});},45000);

/* ---------- boot ---------- */
IMG.avatar=document.querySelector('.avatar img').src;
const restored=restore();
applyTheme();
renderAll();
if(restored)setTimeout(()=>toast('Restored your last session'),300);
