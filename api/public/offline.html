<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2166F5">
    <title>Offline — Ecrivain</title>
    <style>
        :root { color-scheme: light dark; --bg: #f6f7fb; --card: #fff; --text: #111827; --muted: #5b6475; --brand: #2166f5; }
        @media (prefers-color-scheme: dark) { :root { --bg: #0f141c; --card: #171e29; --text: #eef1f6; --muted: #9aa5b8; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
        main { max-width: 420px; width: 100%; background: var(--card); border-radius: 18px; padding: 28px 24px; text-align: center; box-shadow: 0 10px 30px -18px rgba(0,0,0,.35); }
        img { width: 44px; height: 44px; }
        h1 { font-size: 21px; margin: 14px 0 6px; }
        p { color: var(--muted); margin: 0 0 18px; font-size: 15px; }
        a.button { display: block; text-decoration: none; border: 0; border-radius: 10px; background: var(--brand); color: #fff; font: 600 15px system-ui, sans-serif; padding: 12px 20px; min-height: 46px; width: 100%; }
    </style>
</head>
<body>
    <main>
        <img src="/brand/symbol.svg" alt="">
        <h1>You're offline</h1>
        <p>This screen needs a connection to open. If a chapter is open in another tab, keep it open: its changes are saved as soon as you're back online.</p>
        <a class="button" href="/books">Try again</a>
    </main>
</body>
</html>
